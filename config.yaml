# Importance matrix: Claude grades each criterion 0-5 for every item; code computes
# importance = sum(weight * score / 5) (0-100). Weights must sum to 100.
scoring_matrix:
  min_score_to_show: 30      # items below this are never shown, even in a quiet week (no padding)
  criteria:
    - id: exposure
      weight: 30
      question: "How directly does this touch GenZero?"
      levels: {5: "names a GenZero portfolio company or fund", 4: "names a GenZero partner, or a direct competitor of a holding", 3: "names a rival climate investor, or a company in a GenZero focus sector", 2: "adjacent climate/energy sector", 1: "general climate news", 0: "no link"}
    - id: materiality
      weight: 10
      question: "How much money or value is at stake?"
      levels: {5: ">US$500M, or directly changes a holding's value", 4: "US$100-500M", 3: "US$20-100M or a clear measurable effect", 2: "<US$20M", 1: "size not stated", 0: "no financial angle"}
    - id: downside_risk
      weight: 30
      question: "How serious is the negative signal for GenZero or its sectors?"
      levels: {5: "failure, fraud, insolvency or cancellation at a holding, partner or direct competitor", 4: "major setback or policy rollback in a GenZero focus sector", 3: "sector setback elsewhere in climate or energy", 2: "mild negative", 1: "minor concern", 0: "neutral or positive news"}
    - id: thesis_signal
      weight: 15
      question: "Does it change the investment case for a GenZero sector (policy, carbon prices, demand, cost)?"
      levels: {5: "binding policy or large price/demand shift in a focus sector or Singapore/ASEAN", 4: "strong signal in a focus sector", 3: "moderate signal", 2: "weak signal", 1: "marginal", 0: "none"}
    - id: actionability
      weight: 10
      question: "Should GenZero act or check something now?"
      levels: {5: "act this week (deal, co-invest, risk review)", 3: "monitor closely", 1: "background only", 0: "nothing to do"}
    - id: specificity
      weight: 5
      question: "How concrete and credible is the information?"
      levels: {5: "confirmed facts with numbers from a reputable source", 3: "some detail", 1: "headline only or rumour", 0: "unverifiable"}
